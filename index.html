<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f3f5ef">
	<title>Cell Atlas — A visual field guide</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--paper: #f3f5ef;
			--ink: #17251f;
			--muted: #69756e;
			--line: #d8ded7;
			--accent: #d75b43;
			--green: #406a54;
			--mono: "DM Mono", monospace;
			--sans: "DM Sans", sans-serif;
			--display: "Manrope", sans-serif;
		}

		* { box-sizing: border-box; }
		body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
		.topbar {
			position: sticky;
			z-index: 2;
			top: 0;
			height: 68px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 clamp(22px, 5vw, 76px);
			border-bottom: 1px solid rgb(23 37 31 / 12%);
			background: rgb(243 245 239 / 93%);
			backdrop-filter: blur(12px);
		}
		.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; font-family: var(--display); font-size: 14px; font-weight: 800; }
		.brand-mark { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 50%; background: var(--green); }
		.brand-mark::before { content: ""; width: 9px; height: 9px; border: 1.5px solid white; border-radius: 50%; box-shadow: 4px -3px 0 -1px var(--green), 4px -3px 0 0 white; }
		.form-link { color: var(--green); font: 10px var(--mono); letter-spacing: .06em; text-decoration-thickness: 1px; text-underline-offset: 4px; text-transform: uppercase; }
		.top-note, .eyebrow, .section-label, .storage-note { color: var(--muted); font: 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; }
		main { width: min(1080px, calc(100% - 48px)); margin: 0 auto; padding: 58px 0 76px; }
		.page-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 25px; }
		.eyebrow { margin: 0 0 9px; color: var(--green); }
		h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: 0; }
		h1 { font-size: clamp(34px, 5vw, 54px); line-height: 1.05; }
		h2 { font-size: 22px; }
		h3 { font-size: 20px; }
		.storage-note { max-width: 245px; line-height: 1.6; text-align: right; }
		.empty-state { min-height: 190px; display: grid; place-content: center; padding: 28px; border: 1px dashed #b9c4ba; text-align: center; }
		.empty-state h2 { margin-bottom: 8px; font-size: 20px; }
		.empty-state p { margin: 0; color: var(--muted); font-size: 14px; }
		.examples { display: grid; gap: 18px; margin: 0 0 46px; }
		.example { display: grid; grid-template-columns: minmax(220px, .85fr) 1fr; min-height: 270px; border: 1px solid var(--line); background: rgb(255 255 255 / 34%); }
		.example-media { min-height: 270px; display: grid; place-items: center; overflow: hidden; background: #e4e9e1; }
		.example-media img, .example-media video { display: block; width: 100%; max-height: 430px; object-fit: contain; }
		.example-copy { align-self: center; padding: 30px clamp(22px, 4vw, 46px); }
		.example-copy .section-label { display: block; margin-bottom: 9px; color: var(--accent); }
		.example-copy p { margin: 12px 0 0; color: #435149; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
		.status { margin: 18px 0 0; color: #a73524; font-size: 13px; }
		@media (max-width: 700px) {
			.topbar { height: 58px; }
			.top-note { max-width: 150px; font-size: 8px; text-align: right; }
			main { width: min(calc(100% - 36px), 540px); padding-top: 38px; }
			.page-heading { align-items: start; flex-direction: column; gap: 12px; }
			.storage-note { text-align: left; }
			.example { grid-template-columns: 1fr; }
			.example-media { min-height: 210px; max-height: 340px; }
			.example-copy { padding: 22px; }
		}
	</style>
</head>
<body>
	<header class="topbar">
		<a class="brand" href="#" aria-label="Cell Atlas home">
			<span class="brand-mark" aria-hidden="true"></span>
			<span>Cell Atlas</span>
		</a>
		<a class="form-link" href="form/">Manage examples</a>
	</header>

	<main>
		<header class="page-heading">
			<div>
				<p class="eyebrow">Image notes / Open collection</p>
				<h1>Cell Atlas</h1>
			</div>
			<p class="storage-note">Examples are saved in this browser and are not shared with other visitors.</p>
		</header>

		<section id="examples" class="examples" aria-label="Examples" aria-live="polite"></section>
		<section id="empty-state" class="empty-state" aria-live="polite">
			<div>
				<h2>No examples yet</h2>
				<p>Add an image or video with a description to start the collection.</p>
			</div>
		</section>

		<p id="status" class="status" role="status" aria-live="polite"></p>
	</main>

	<script>
		const databaseName = 'cell-atlas';
		const databaseVersion = 1;
		const examplesElement = document.querySelector('#examples');
		const emptyStateElement = document.querySelector('#empty-state');
		const statusElement = document.querySelector('#status');
		let database;
		let mediaUrls = [];

		function openDatabase() {
			return new Promise((resolve, reject) => {
				const request = indexedDB.open(databaseName, databaseVersion);
				request.onupgradeneeded = () => {
					request.result.createObjectStore('examples', { keyPath: 'id' });
				};
				request.onsuccess = () => resolve(request.result);
				request.onerror = () => reject(request.error);
			});
		}

		function createExampleCard(example, index) {
			const card = document.createElement('article');
			card.className = 'example';

			const mediaContainer = document.createElement('div');
			mediaContainer.className = 'example-media';
			const mediaUrl = URL.createObjectURL(example.media);
			mediaUrls.push(mediaUrl);
			const media = document.createElement(example.mediaType.startsWith('video/') ? 'video' : 'img');
			media.src = mediaUrl;
			if (media instanceof HTMLVideoElement) {
				media.controls = true;
				media.preload = 'metadata';
				media.setAttribute('aria-label', example.title);
			} else {
				media.alt = example.title;
				media.loading = 'lazy';
			}
			mediaContainer.append(media);

			const copy = document.createElement('div');
			copy.className = 'example-copy';
			const label = document.createElement('span');
			label.className = 'section-label';
			label.textContent = `Field note ${String(index + 1).padStart(2, '0')}`;
			const title = document.createElement('h3');
			title.textContent = example.title;
			const description = document.createElement('p');
			description.textContent = example.description;
			copy.append(label, title, description);
			card.append(mediaContainer, copy);
			return card;
		}

		async function refreshExamples() {
			const examples = await new Promise((resolve, reject) => {
				const request = database.transaction('examples', 'readonly').objectStore('examples').getAll();
				request.onsuccess = () => resolve(request.result);
				request.onerror = () => reject(request.error);
			});
			mediaUrls.forEach((url) => URL.revokeObjectURL(url));
			mediaUrls = [];
			examplesElement.replaceChildren(...examples.map(createExampleCard));
			emptyStateElement.hidden = examples.length > 0;
		}

		async function initialize() {
			try {
				if (!('indexedDB' in window)) throw new Error('This browser does not support local example storage.');
				database = await openDatabase();
				await refreshExamples();
			} catch (error) {
				statusElement.textContent = `Could not load examples: ${error.message || 'browser storage is unavailable.'}`;
				statusElement.setAttribute('role', 'alert');
			}
		}

		initialize();
	</script>
</body>
</html>
